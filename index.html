d.an+"</div>":"";return'<div class="ic"><div class="in">'+ind.n+' <span style="font-size:11px;padding:2px 8px;border-radius:12px;background:rgba(96,165,250,0.12);color:#60a5fa">'+ind.c+ind.u+'</span></div><div style="display:flex;align-items:baseline;margin-bottom:8px"><span class="cv">'+ind.c+'</span><span class="cb '+(ind.cd==="up"?"cu":"cd")+'">'+(ind.cd==="up"?"▲":"▼")+" "+(ind.ch>0?"+":"")+ind.ch+'%</span></div><div class="ps"><div style="font-size:13px;color:#9ca3af;margin-bottom:10px">📊 過去'+py()+'年で見ると？</div><div class="rt"><div class="rm" style="left:'+rf+'%">'+pct.toFixed(0)+'%</div></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:4px"><span>'+mn.toFixed(1)+ind.u+'</span><span>最低</span><span>最高</span><span>'+mx.toFixed(1)+ind.u+'</span></div><div class="sg"><div class="si"><div class="sl">平均</div><div class="sv">'+av.toFixed(1)+'</div></div><div class="si"><div class="sl">最高</div><div class="sv">'+mx.toFixed(1)+'</div></div><div class="si"><div class="sl">最低</div><div class="sv">'+mn.toFixed(1)+'</div></div><div class="si"><div class="sl">標準偏差</div><div class="sv">'+((mx-mn)/4.5).toFixed(2)+'</div></div></div></div><div class="jb '+cc+'">'+jd.l+'</div><div style="margin:12px 0"><div style="font-size:12px;color:#9ca3af;margin-bottom:8px">📈 過去との比較</div>'+hh+'</div><div class="ex"><strong style="color:#f0f0f5">20年間で見ると</strong><br>'+ind.ex+'</div><div class="ex" style="border-left-color:#22d3ee"><strong style="color:#f0f0f5">💡 高い・低いの意味</strong><br>'+ind.hm+"</div>"+ah+"</div>"}function rv(){const l=document.getElementById("iL"),sV=document.getElementById("sV"),hV=document.getElementById("hV"),kV=document.getElementById("kV");if(T==="d"){let html="";Object.values(I).forEach(ind=>{if(ind.sc.includes("d"))html+=rc(ind)});l.innerHTML=html}else if(T==="s"){let html="";S.s.forEach(id=>html+=rc(I[id]||I.c));sV.innerHTML=html}else if(T==="h"){let html="";S.h.forEach(id=>html+=rc(I[id]||I.c));hV.innerHTML=html}else if(T==="k"){let html="";S.k.forEach(id=>html+=rc(I[id]||I.c));kV.innerHTML=html}}document.getElementById("tB").addEventListener("click",e=>{if(!e.target.classList.contains("t"))return;document.querySelectorAll(".t").forEach(t=>t.classList.remove("a"));e.target.classList.add("a");T=e.target.dataset.t;["d","s","h","k"].forEach(v=>{document.getElementById(v+"V").classList.toggle("hd",v!==T)});rv()});document.querySelector(".pb").addEventListener("click",e=>{if(!e.target.classList.contains("b"))return;document.querySelectorAll(".b").forEach(b=>b.classList.remove("a"));e.target.classList.add("a");P=parseInt(e.target.dataset.p);rv()});rv();</script></body></html>
